[project]
name = "ytrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "pymupdf>=1.28.2",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.34",
    "ruff>=0.17.6",
    "sentence-transformers>=6.0.0",
    "uvicorn>=0.52.3",
]

[project.scripts]
ytrag = "ytrag:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

